[package]
name = "sheetcraft"
version = "0.1.0"
edition = "2024"
description = "An open-source spreadsheet editor written from scratch in pure Rust"
license = "MIT"
repository = "https://github.com/dsk-dev-ai/sheetcraft"
keywords = ["spreadsheet", "excel", "rust", "offline", "privacy"]
categories = ["gui", "parser-implementations"]

[dependencies]
calamine = "0.37.0"
eframe = { version = "0.37.0", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rust_xlsxwriter = "0.102.0"

[[bin]]
name = "sheetcraft"
path = "src/main.rs"

[[bin]]
name = "sheetcraft-gui"
path = "src/bin/sheetcraft-gui.rs"
required-features = ["gui"]

[features]
gui = ["dep:eframe"]
